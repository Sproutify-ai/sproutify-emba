{% extends '_base.html' %}

{% block content %}
  <div class="column is-4 is-offset-4">
    <h3 class="title">Welcome</h3>
    <div class="box">
      {% with messages=get_flashed_messages() %}
        {% if messages %}
          <div class="notification is-danger">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}
      <form method="POST" action="/login">
        <div class="field">
          <label class="label">Select your screener identity</label>
          <div class="control">
            <div class="select is-fullwidth is-large">
              <select name="screener" id="screener-select" required>
                <option value="" disabled selected>Choose...</option>
                <option value="Pooja">Pooja</option>
                <option value="Rebecca">Rebecca</option>
                <option value="Tessa">Tessa</option>
                <option value="Samuel">Samuel</option>
                <option value="Screener 5">Screener 5</option>
                <option value="Screener 6">Screener 6</option>
                <option value="Other User">Other User</option>
              </select>
            </div>
          </div>
        </div>

        <div class="field" id="email-field" style="display: none;">
          <label class="label">Your Email</label>
          <div class="control">
            <input class="input is-large" type="email" name="email" id="email-input" placeholder="name@example.com" />
          </div>
        </div>

        <!-- 
        <div class="field">
          <div class="control">
            <input class="input is-large" type="password" name="password" placeholder="Your Password" />
          </div>
        </div>
        <div class="field">
          <label class="checkbox"><input type="checkbox" name="remember" />Remember me</label>
        </div>
         -->
        <button class="button is-block is-info is-large is-fullwidth">Enter</button>
      </form>
      <p class="has-text-grey is-size-7 mt-3">We’re so grateful to you!</p>
    </div>
  </div>
  <script>
    (function(){
      var sel = document.getElementById('screener-select')
      var emailField = document.getElementById('email-field')
      var emailInput = document.getElementById('email-input')
      function toggleEmail(){
        if (sel.value === 'Other User') {
          emailField.style.display = 'block'
          emailInput.required = true
        } else {
          emailField.style.display = 'none'
          emailInput.required = false
          emailInput.value = ''
        }
      }
      sel.addEventListener('change', toggleEmail)
      toggleEmail()
    })()
  </script>
{% endblock %}
