{% extends '_base.html' %}

{% block content %}
  <div class="column is-4 is-offset-4">
    <h3 class="title">Welcome</h3>
    <div class="box">
      {% with messages=get_flashed_messages() %}
        {% if messages %}
          <div class="notification is-danger">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}
      <form method="POST" action="/login">
        <div class="field">
          <label class="label">Select your screener identity</label>
          <div class="control">
            <div class="select is-fullwidth is-large">
              <select name="screener" required>
                <option value="" disabled selected>Choose...</option>
                <option value="Pooja">Pooja</option>
                <option value="Rebecca">Rebecca</option>
                <option value="Screener 3">Screener 3</option>
                <option value="Screener 4">Screener 4</option>
              </select>
            </div>
          </div>
        </div>

        <!-- 
        <div class="field">
          <div class="control">
            <input class="input is-large" type="password" name="password" placeholder="Your Password" />
          </div>
        </div>
        <div class="field">
          <label class="checkbox"><input type="checkbox" name="remember" />Remember me</label>
        </div>
         -->
        <button class="button is-block is-info is-large is-fullwidth">Enter</button>
      </form>
      <p class="has-text-grey is-size-7 mt-3">We’re so grateful to you!</p>
    </div>
  </div>
{% endblock %}
